<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>To-Do List – Welcome</title>

    <!-- Bootstrap (if you want to keep things consistent later) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: url("../static/login-bg-2.jpg") center/cover no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
            font-family: Arial, sans-serif;
        }

        .welcome-box {
            background: rgba(255, 255, 255, 0.8);
            padding: 40px;
            border-radius: 10px;
            width: 350px;
            text-align: center;
            box-shadow: 0px 0px 20px rgba(0,0,0,0.2);
            animation: fadeIn 1.2s ease;
        }

        .welcome-box img {
            width: 80px;
            margin-bottom: 15px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes float {
            0% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0); }
        }

        .login-button {
            margin-top: 20px;
            padding: 10px 20px;
            width: 100%;
            border: none;
            border-radius: 5px;
            background: #007bff;
            color: white;
            font-size: 16px;
            transition: background 0.3s;
        }

        .login-button:hover {
            background: #0056b3;
        }

        .app-title {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .app-desc {
            font-size: 15px;
            color: #444;
        }
    </style>
</head>

<body>

    <div class="welcome-box">
        <img src="{{ url_for('static', filename='book-2.png') }}" alt="App Icon">
        <div class="app-title">To-Do List</div>
        <div class="app-desc">Keep your life less messy... hopefully.</div>

        <button class="login-button" onclick="location.href='/login'">
            Login to Start
        </button>
    </div>

</body>
</html>
