<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - To-Do List</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f2f2f2;
            font-family: "Segoe UI", sans-serif;
        }

        .login-container {
            max-width: 420px;
            margin: 8vh auto;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.2);
            padding: 40px 30px;
            border-radius: 14px;
            border: 1px solid #ddd;
            box-shadow: 0 0 18px rgba(0,0,0,0.05);
            position: relative;
        }

        .login-title {
            font-size: 26px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 8px;
            position: relative;
        }

        /* fake pin/marker effect */
        .login-title::before {
            content: "";
            width: 16px;
            height: 16px;
            background: #007bff;
            border-radius: 50%;
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
        }

        /* light lined-paper effect */
        .login-card::after {
            content: "";
            position: absolute;
            inset: 0;
            background-image: linear-gradient(to bottom, rgba(0,0,0,0.04) 1px, transparent 1px);
            background-size: 100% 36px;
            border-radius: 14px;
            pointer-events: none;
            z-index: 1;
        }

        .form-control {
            border-radius: 8px;
        }

        .btn-task {
            width: 100%;
            font-weight: 600;
            border-radius: 8px;
        }

        .footer-text {
            font-size: 14px;
            text-align: center;
        }
        body{
            background-image: url("../static/login-bg-3.jpg");
            background-size: cover;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-card">
            <div class="login-title">Log In</div>

            <form method="POST" action="/login">
                <div class="mb-3">
                    <label class="form-label">Email or Username</label>
                    <input type="text" class="form-control" placeholder="yourname" name="email_or_username">
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" placeholder="••••••••" name="password">
                </div>

                <button type="submit" class="btn btn-primary btn-task">Continue</button>

                </div>
                <div class="mt-2 footer-text">
                    Don't have an account? <a href="/register">Sign Up</a>
                </div>
            </form>
        </div>
    </div>

    {% if message %}
        <script>
            window.onload = function() {
                alert("{{ message }}");
            }
        </script>
    {% endif %}
</body>
</html>
